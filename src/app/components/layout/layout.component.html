<header class="sticky top-0 z-50 w-full border-b border-white/10 bg-tanteo-dark/80 backdrop-blur-md">
  <div class="container mx-auto flex h-20 items-center justify-between">
    <!-- Logo -->
    <div class="flex flex-1 items-center">
      <a routerLink="/" class="flex items-center">
        <img ngSrc="/horizontal.png" alt="Tanteo Logo" width="160" height="40" priority class="h-10 w-auto" />
      </a>
    </div>
    <!-- Desktop CTA -->
    <div class="hidden md:flex md:flex-1 md:justify-end items-center">
      <!-- Desktop Navigation -->
    <nav class="hidden md:flex md:gap-x-4 me-4">
      <a
        routerLink="/"
        fragment="inicio"
        routerLinkActive="text-tanteo-orange"
        [routerLinkActiveOptions]="{ exact: true }"
        class="text-sm font-semibold leading-6 text-white transition-colors hover:text-tanteo-orange"
      >
        Inicio
      </a>
      <a
        routerLink="/"
        fragment="experiencia"
        routerLinkActive="text-tanteo-orange"
        class="text-sm font-semibold leading-6 text-white transition-colors hover:text-tanteo-orange"
      >
        Experiencia
      </a>
      <a
        routerLink="/"
        fragment="contacto"
        routerLinkActive="text-tanteo-orange"
        class="text-sm font-semibold leading-6 text-white transition-colors hover:text-tanteo-orange"
      >
        Contacto
      </a>
    </nav>
      <a
        routerLink="/"
        fragment="contacto"
        class="rounded-full bg-tanteo-orange px-6 py-2.5 text-sm font-bold text-white shadow-sm transition-transform hover:scale-105"
      >
        Empezar ahora
      </a>
    </div>

    <!-- Mobile menu button -->
    <div class="flex md:hidden">
      <button
        type="button"
        (click)="toggleMenu()"
        class="inline-flex items-center justify-center rounded-md p-2.5 text-white"
      >
        <span class="sr-only">Abrir menú principal</span>
        @if (!isMenuOpen()) {
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
        } @else {
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        }
      </button>
    </div>
  </div>

  <!-- Mobile menu -->
  @if (isMenuOpen()) {
    <div class="md:hidden border-t border-white/10 bg-tanteo-dark px-4 py-6">
      <div class="space-y-4">
        <a
          routerLink="/"
          fragment="inicio"
          (click)="closeMenu()"
          class="block text-base font-semibold text-white hover:text-tanteo-orange"
        >
          Inicio
        </a>
        <a
          routerLink="/"
          fragment="experiencia"
          (click)="closeMenu()"
          class="block text-base font-semibold text-white hover:text-tanteo-orange"
        >
          Experiencia
        </a>
        <a
          routerLink="/"
          fragment="contacto"
          (click)="closeMenu()"
          class="block text-base font-semibold text-white hover:text-tanteo-orange"
        >
          Contacto
        </a>
        <a
          routerLink="/"
          fragment="contacto"
          (click)="closeMenu()"
          class="block w-full rounded-full bg-tanteo-orange px-6 py-3 text-center text-base font-bold text-white"
        >
          Empezar ahora
        </a>
      </div>
    </div>
  }
</header>

<main>
  <ng-content></ng-content>
</main>

<footer class="border-t border-white/10 bg-tanteo-dark py-12">
  <div class="container mx-auto px-4 text-center">
    <img ngSrc="/logo.png" alt="Tanteo Logo" width="144" height="48" class="mx-auto h-12 w-auto opacity-50 grayscale" />
    <p class="mt-4 text-sm text-slate-500">
      © 2026 Tanteo. Todos los derechos reservados.
    </p>
  </div>
</footer>
footer>
